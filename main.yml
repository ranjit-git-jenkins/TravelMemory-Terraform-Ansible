---
- name: Install Node.js and web dependencies
  ansible.builtin.apt:
    name: [nodejs, npm, git, nginx, python3]
    update_cache: true
    state: present
- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: true
- name: Clone application source
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_root }}"
    version: "{{ app_branch }}"
    force: false
  become_user: "{{ app_user }}"
- name: Install backend dependencies
  community.general.npm:
    path: "{{ app_root }}/{{ backend_dir }}"
    production: true
- name: Install frontend dependencies
  community.general.npm:
    path: "{{ app_root }}/{{ frontend_dir }}"
- name: Build frontend
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ app_root }}/{{ frontend_dir }}"
  environment:
    REACT_APP_API_URL: /api
- name: Install backend environment file
  ansible.builtin.template:
    src: backend.env.j2
    dest: /etc/travelmemory.env
    owner: root
    group: root
    mode: '0600'
  notify: Restart TravelMemory
- name: Install systemd unit
  ansible.builtin.template:
    src: travelmemory.service.j2
    dest: /etc/systemd/system/travelmemory.service
    mode: '0644'
  notify: Restart TravelMemory
- name: Install nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/travelmemory
    mode: '0644'
  notify: Reload nginx
- name: Enable nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/travelmemory
    dest: /etc/nginx/sites-enabled/travelmemory
    state: link
  notify: Reload nginx
- name: Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
- name: Enable backend service
  ansible.builtin.systemd:
    name: travelmemory
    enabled: true
    daemon_reload: true
    state: started
